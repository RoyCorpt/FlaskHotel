<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Antrian Tamu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style-antrian.css') }}">
</head>
<body>
    <div class="container">
        <h2>Antrian Tamu</h2>
        {% if queue %}
        <ul class="guest-list">
            {% for name in queue %}
            <li>{{ name }}</li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="empty-msg">Tidak ada tamu dalam antrian.</p>
        {% endif %}
        <div class="link-group">
            <a href="/">Kembali ke Beranda</a>
        </div>
    </div>
</body>
</html>
